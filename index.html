<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Index</title>
<meta name="description" content="A private, phone-first app that holds your whole life — beautifully in order.">
<meta name="theme-color" content="#BFA6FF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Index">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<style>
  :root{
    --font-display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-body:'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-accent:'Dancing Script', 'Snell Roundhand', 'Brush Script MT', cursive;

    /* Light — pastel dream */
    --lavender:#BFA6FF; --pink:#FFB6E6; --pink-soft:#FFD6F3;
    --mint:#C6F1FF; --blue:#AEEBFF; --yellow:#FDE68A;
    --bg-0:#efe7ff; --bg-1:#f6ecff; --bg-2:#ffeaf7;
    --ink:#4a3f6b; --ink-soft:#8b80a8; --ink-faint:#a99fc4;
    --card:rgba(255,255,255,.72); --card-2:rgba(255,255,255,.55);
    --border:rgba(150,120,220,.18); --border-2:rgba(150,120,220,.12);
    --shadow:0 8px 28px rgba(150,120,220,.20);
    --shadow-sm:0 4px 14px rgba(150,120,220,.16);
    --grad:linear-gradient(135deg,#BFA6FF 0%,#FFB6E6 100%);
    --grad-cool:linear-gradient(135deg,#AEEBFF 0%,#BFA6FF 100%);
    --nav-bg:rgba(255,255,255,.72);
    --star:rgba(150,120,220,.55);
    --good:#39b57e; --warn:#e08a3c; --danger:#e26d8a;
    --chip:rgba(255,255,255,.7);
    color-scheme: light;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body); color:var(--ink);
    background:
      radial-gradient(120% 80% at 100% 0%, var(--bg-2) 0%, transparent 55%),
      radial-gradient(120% 90% at 0% 100%, var(--bg-2) 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 55%, var(--bg-2) 100%);
    background-attachment:fixed;
    min-height:100vh; min-height:100dvh;
    -webkit-font-smoothing:antialiased; line-height:1.5;
    overflow-x:hidden;
  }
  /* starfield */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.9;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, var(--star) 50%, transparent),
      radial-gradient(1.2px 1.2px at 78% 12%, var(--star) 50%, transparent),
      radial-gradient(1.6px 1.6px at 62% 32%, var(--star) 50%, transparent),
      radial-gradient(1.1px 1.1px at 28% 42%, var(--star) 50%, transparent),
      radial-gradient(1.3px 1.3px at 88% 48%, var(--star) 50%, transparent),
      radial-gradient(1.5px 1.5px at 42% 8%, var(--star) 50%, transparent),
      radial-gradient(1.1px 1.1px at 8% 62%, var(--star) 50%, transparent),
      radial-gradient(1.4px 1.4px at 70% 72%, var(--star) 50%, transparent);
    animation:twinkle 5s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){ body::before{animation:none} }

  .app{position:relative; z-index:1; max-width:500px; margin:0 auto; padding:0 18px 120px; min-height:100dvh}
  .screen{animation:rise .38s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0; transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .screen{animation:none} }

  /* App bar */
  .appbar{display:flex; align-items:center; justify-content:space-between; padding:22px 2px 6px}
  .brand{font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:-.01em;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
  .brand .spk{-webkit-text-fill-color:initial; color:var(--pink)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
    color:#fff;font-weight:700;box-shadow:var(--shadow-sm);border:2px solid var(--card);cursor:pointer;font-size:15px}
  .iconbtn{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--border);
    display:grid;place-items:center;font-size:17px;cursor:pointer;box-shadow:var(--shadow-sm);color:var(--ink)}

  /* Greeting */
  .greet{margin:14px 2px 20px}
  .greet .hi{font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1.15; margin:0}
  .greet .name{font-family:var(--font-accent); font-size:38px; font-weight:700; color:var(--lavender); line-height:1}
  .greet .sub{font-size:13.5px; color:var(--ink-soft); margin-top:4px}

  h2.title{font-family:var(--font-display); font-size:22px; font-weight:700; margin:0 0 2px}
  .screen-head{display:flex; align-items:flex-end; justify-content:space-between; margin:6px 2px 16px}
  .screen-head .sub{font-size:13px;color:var(--ink-soft)}

  .section-label{font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--ink-soft);
    text-transform:uppercase; margin:22px 4px 10px; display:flex; align-items:center; gap:6px}

  /* Cards */
  .card{background:var(--card); border:1px solid var(--border); border-radius:24px; padding:18px;
    box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
  .card.tight{padding:14px}

  /* Snapshot rows */
  .snap{display:flex; flex-direction:column; gap:2px}
  .snap-row{display:flex; align-items:center; gap:14px; padding:11px 4px}
  .snap-row + .snap-row{border-top:1px solid var(--border-2)}
  .bubble{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;
    box-shadow:var(--shadow-sm)}
  .b-lav{background:linear-gradient(135deg,var(--lavender),var(--pink-soft))}
  .b-mint{background:linear-gradient(135deg,var(--mint),var(--blue))}
  .b-pink{background:linear-gradient(135deg,var(--pink),var(--pink-soft))}
  .b-yellow{background:linear-gradient(135deg,var(--yellow),var(--pink-soft))}
  .snap-row .txt{flex:1; min-width:0}
  .snap-row .lead{font-size:14px; color:var(--ink-soft); line-height:1.25}
  .snap-row .big{font-weight:600; font-size:15.5px; color:var(--ink)}
  .snap-row .when{font-weight:700}
  .pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;
    background:var(--chip);border:1px solid var(--border-2);color:var(--ink-soft)}
  .pill.soon{color:var(--danger)}

  /* Quick add grid */
  .qa-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:2px}
  .qa{display:flex; align-items:center; gap:10px; padding:14px; border-radius:18px; cursor:pointer;
    background:var(--card-2); border:1px solid var(--border); font-weight:500; font-size:14px; color:var(--ink);
    box-shadow:var(--shadow-sm); transition:transform .12s ease}
  .qa:active{transform:scale(.96)}
  .qa .e{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}

  /* stat row */
  .stat-row{display:flex; gap:10px; margin-top:12px}
  .stat{flex:1; background:var(--card-2); border:1px solid var(--border); border-radius:18px; padding:13px 14px}
  .stat .k{font-size:11.5px; color:var(--ink-soft); font-weight:500}
  .stat .v{font-family:var(--font-display); font-weight:700; font-size:20px; margin-top:3px}
  .stat .v small{font-size:13px; color:var(--ink-soft); font-weight:600; font-family:var(--font-body)}

  /* Vault list */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px; -webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip-f{white-space:nowrap; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:500; cursor:pointer;
    background:var(--chip); border:1px solid var(--border); color:var(--ink-soft)}
  .chip-f.on{background:var(--grad); color:#fff; border-color:transparent; box-shadow:var(--shadow-sm)}
  .v-list{display:flex; flex-direction:column; gap:12px}
  .v-card{display:flex; align-items:center; gap:14px; padding:15px; cursor:pointer; transition:transform .12s ease}
  .v-card:active{transform:scale(.985)}
  .v-card .meta{flex:1; min-width:0}
  .v-card .t{font-weight:600; font-size:15.5px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .v-card .p{font-size:12.5px; color:var(--ink-soft); margin:2px 0 0}
  .v-card .right{text-align:right; flex:0 0 auto}
  .v-card .cost{font-weight:700; font-size:14.5px}
  .v-card .due{font-size:11px; color:var(--ink-soft); margin-top:2px}

  /* Buttons */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none;
    border-radius:16px; padding:15px 18px; font-family:var(--font-body); font-weight:600; font-size:15px;
    cursor:pointer; background:var(--grad); color:#fff; box-shadow:var(--shadow-sm); transition:transform .12s ease}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--border); box-shadow:none}
  .btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
  .btn.sm{width:auto; padding:10px 16px; font-size:13.5px; border-radius:13px}

  /* Forms */
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:0 0 6px 4px}
  .field input,.field select,.field textarea{width:100%; font-family:var(--font-body); font-size:15px; color:var(--ink);
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 14px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease}
  .field textarea{resize:vertical; min-height:76px}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lavender);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--lavender) 28%, transparent)}
  .field input::placeholder,.field textarea::placeholder{color:var(--ink-faint)}
  .field select{appearance:none; -webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
    background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px; background-size:6px 6px,6px 6px; background-repeat:no-repeat}
  .field.locked input{padding-right:48px}
  .reveal{position:absolute; right:10px; bottom:9px; width:30px;height:30px;border:none;background:transparent;
    cursor:pointer; font-size:16px; color:var(--ink-soft)}
  .lockwrap{position:relative}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .locknote{font-size:11.5px; color:var(--ink-faint); margin:-8px 4px 0; display:flex; gap:5px; align-items:center}

  /* search */
  .search{position:relative; margin-bottom:12px}
  .search input{width:100%; font-family:var(--font-body); font-size:14.5px; color:var(--ink); background:var(--card);
    border:1px solid var(--border); border-radius:16px; padding:13px 14px 13px 42px; outline:none}
  .search .mag{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:15px}

  /* empty / coming soon */
  .empty{text-align:center; padding:46px 20px; color:var(--ink-soft)}
  .empty .em{font-size:52px; margin-bottom:10px; filter:drop-shadow(0 6px 12px rgba(0,0,0,.15))}
  .empty h3{font-family:var(--font-display); color:var(--ink); font-size:21px; margin:0 0 6px}
  .empty p{font-size:14px; margin:0 auto; max-width:280px}
  .soon-tag{display:inline-block; margin-top:14px; font-size:12px; font-weight:600; padding:6px 14px; border-radius:999px;
    background:var(--grad); color:#fff; box-shadow:var(--shadow-sm)}

  /* Recipes */
  .r-grid{display:flex; flex-direction:column; gap:14px}
  .r-card{padding:0; overflow:hidden; cursor:pointer; transition:transform .12s ease}
  .r-card:active{transform:scale(.99)}
  .r-photo{position:relative; height:150px; background:var(--grad-cool); display:grid; place-items:center; font-size:52px}
  .r-photo img{width:100%; height:100%; object-fit:cover; display:block}
  .r-fav{position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.85); box-shadow:var(--shadow-sm); font-size:17px; display:grid; place-items:center}
  .r-body{padding:14px 16px 16px}
  .r-body .rn{font-family:var(--font-display); font-weight:700; font-size:18px; margin:0 0 8px}
  .r-stats{display:flex; gap:8px; flex-wrap:wrap}
  .r-stat{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; color:var(--ink-soft);
    background:var(--card-2); border:1px solid var(--border-2); padding:5px 10px; border-radius:999px}
  .r-stat b{color:var(--ink); font-weight:700}

  /* recipe detail */
  .r-hero{height:210px; border-radius:24px; overflow:hidden; position:relative; background:var(--grad-cool);
    display:grid; place-items:center; font-size:74px; box-shadow:var(--shadow); margin-bottom:8px}
  .r-hero img{width:100%; height:100%; object-fit:cover}
  .r-hero .r-fav{width:44px;height:44px;font-size:20px}
  .r-title{font-family:var(--font-display); font-weight:700; font-size:26px; margin:14px 2px 4px}
  .r-sub{font-size:13px; color:var(--ink-soft); margin:0 2px 14px}
  .r-metrics{display:flex; gap:10px; margin:0 0 6px}
  .r-metric{flex:1; text-align:center; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:13px 8px; box-shadow:var(--shadow-sm)}
  .r-metric .mv{font-family:var(--font-display); font-weight:700; font-size:18px}
  .r-metric .mk{font-size:11px; color:var(--ink-soft); margin-top:2px}
  .ing-list{display:flex; flex-direction:column}
  .ing{display:flex; align-items:center; gap:10px; padding:11px 2px; font-size:14.5px}
  .ing + .ing{border-top:1px solid var(--border-2)}
  .ing .dot{width:8px;height:8px;border-radius:50%;background:var(--lavender);flex:0 0 auto}
  .ing .in{flex:1}
  .ing .iq{color:var(--ink-soft); font-size:13px}
  .ing .ic2{font-weight:700; font-variant-numeric:tabular-nums}
  .total-row{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:14px; border-top:1px dashed var(--border)}
  .total-row .tk{font-size:13px; color:var(--ink-soft)}
  .total-row .tv{font-family:var(--font-display); font-weight:700; font-size:22px}
  .steps-list{margin:0; padding:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:12px}
  .steps-list li{counter-increment:s; display:flex; gap:12px; font-size:14.5px; line-height:1.5}
  .steps-list li::before{content:counter(s); flex:0 0 auto; width:26px; height:26px; border-radius:9px; background:var(--grad);
    color:#fff; font-weight:700; font-size:13px; display:grid; place-items:center; font-family:var(--font-body)}

  /* ingredient editor rows */
  .ing-edit{display:flex; flex-direction:column; gap:8px}
  .ing-row{display:grid; grid-template-columns:1fr 58px 44px 66px 30px; gap:6px; align-items:center}
  .ing-row input{width:100%; font-family:var(--font-body); font-size:13.5px; color:var(--ink);
    background:var(--card); border:1px solid var(--border); border-radius:11px; padding:10px 9px; outline:none}
  .ing-row input:focus{border-color:var(--lavender)}
  .ing-row .rm{width:30px;height:30px;border:none;background:transparent;color:var(--danger);font-size:18px;cursor:pointer;border-radius:8px}
  .ing-head{display:grid; grid-template-columns:1fr 58px 44px 66px 30px; gap:6px; font-size:10.5px; color:var(--ink-faint);
    font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:0 2px}
  .add-ing{align-self:flex-start; margin-top:2px}
  .live-total{display:flex; justify-content:space-between; align-items:center; background:var(--card-2);
    border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-top:10px; font-size:14px}
  .live-total b{font-family:var(--font-display); font-size:18px}

  /* photo picker */
  .photo-pick{height:130px; border-radius:18px; border:1.5px dashed var(--border-strong,var(--border)); cursor:pointer;
    display:grid; place-items:center; text-align:center; color:var(--ink-soft); font-size:13px; overflow:hidden; position:relative;
    background:var(--card-2)}
  .photo-pick img{width:100%;height:100%;object-fit:cover}
  .photo-pick .ph-x{position:absolute; top:8px; right:8px; width:30px;height:30px;border-radius:50%;border:none;
    background:rgba(255,255,255,.9); box-shadow:var(--shadow-sm); cursor:pointer; font-size:15px}

  /* rating stars */
  .stars{display:flex; gap:4px; font-size:24px}
  .stars .st{cursor:pointer; filter:grayscale(1) opacity(.4)}
  .stars .st.on{filter:none}

  /* My Body */
  .tabs{display:flex; gap:5px; background:var(--card-2); border:1px solid var(--border); border-radius:16px; padding:5px; margin-bottom:16px}
  .tab{flex:1; text-align:center; padding:10px 6px; border-radius:12px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; border:none; background:transparent; font-family:var(--font-body); transition:all .15s ease}
  .tab.on{background:var(--grad); color:#fff; box-shadow:var(--shadow-sm)}
  .big-stat{text-align:center; padding:6px 0 10px}
  .big-stat .bv{font-family:var(--font-display); font-weight:800; font-size:44px; line-height:1}
  .big-stat .bv small{font-size:20px; font-weight:600; color:var(--ink-soft)}
  .big-stat .bk{font-size:13px; color:var(--ink-soft); margin-top:6px}
  .delta{display:inline-flex; align-items:center; gap:4px; font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:999px; margin-top:8px}
  .delta.down{color:var(--good); background:color-mix(in srgb,var(--good) 14%,transparent)}
  .delta.up{color:var(--danger); background:color-mix(in srgb,var(--danger) 14%,transparent)}
  .delta.flat{color:var(--ink-soft); background:var(--chip)}
  .spark{width:100%; height:70px; display:block; margin-top:6px}
  .mini-form{display:flex; gap:8px; align-items:flex-end}
  .mini-form .field{margin:0; flex:1}
  .mini-form .btn{width:auto; flex:0 0 auto; padding:13px 16px}
  .log-row{display:flex; align-items:center; gap:12px; padding:11px 2px}
  .log-row + .log-row{border-top:1px solid var(--border-2)}
  .log-row .ld{font-size:12.5px; color:var(--ink-soft); width:74px; flex:0 0 auto}
  .log-row .lv{font-weight:700; font-size:15px}
  .log-row .ln{flex:1; font-size:13px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .log-row .del{margin-left:auto; border:none; background:transparent; color:var(--ink-faint); font-size:15px; cursor:pointer; flex:0 0 auto}
  .mood-picker{display:flex; justify-content:space-between; gap:6px; margin:4px 0 2px}
  .mood-btn{flex:1; aspect-ratio:1; border:1px solid var(--border); background:var(--card-2); border-radius:16px; font-size:26px;
    cursor:pointer; display:grid; place-items:center; transition:transform .12s ease, border-color .12s ease}
  .mood-btn:active{transform:scale(.9)}
  .mood-btn.on{border-color:var(--lavender); background:var(--pink-soft); box-shadow:var(--shadow-sm)}
  .cycle-hero{text-align:center; padding:4px 0 6px}
  .cycle-hero .ch-day{font-family:var(--font-display); font-weight:800; font-size:38px}
  .cycle-hero .ch-k{font-size:13px; color:var(--ink-soft)}
  .pred{display:flex; gap:10px; margin-top:12px}
  .pred .stat{text-align:center}

  /* Spending */
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
  .month-nav .mlbl{font-family:var(--font-display); font-weight:700; font-size:17px}
  .month-nav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--card);
    color:var(--ink);font-size:16px;cursor:pointer;box-shadow:var(--shadow-sm)}
  .spend-total{text-align:center; padding:2px 0 4px}
  .spend-total .st-v{font-family:var(--font-display); font-weight:800; font-size:40px; line-height:1}
  .spend-total .st-k{font-size:12.5px; color:var(--ink-soft); margin-top:4px}
  .donut-wrap{display:flex; align-items:center; gap:18px; margin-top:8px}
  .donut{width:132px;height:132px;border-radius:50%;flex:0 0 auto;position:relative;display:grid;place-items:center}

  /* ---------- My Body screens ---------- */
  function today(){return new Date().toISOString().slice(0,10);}
  function fmtDate(iso){ if(!iso)return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short'}); }
  function daysBetween(a,b){ if(!a||!b)return 0; return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
  function addDays(iso,n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
  function nextPeriodInfo(){
    var ps=body.periods.slice().sort(function(a,b){return (a.start||'').localeCompare(b.start||'')});
    if(!ps.length) return null;
    var gaps=[]; for(var i=1;i<ps.length;i++){var g=daysBetween(ps[i-1].start,ps[i].start); if(g>10&&g<60)gaps.push(g);}
    var avg=gaps.length? Math.round(gaps.reduce(function(s,x){return s+x},0)/gaps.length):28;
    var last=ps[ps.length-1]; var nextStart=addDays(last.start,avg);
    return {date:nextStart,days:daysUntil(nextStart),avg:avg,cycleDay:daysBetween(last.start,today())+1,last:last.start};
  }
  function sparkline(vals){
    if(vals.length<2) return '';
    var w=300,h=60,pad=8, min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), rng=(max-min)||1;
    var pts=vals.map(function(v,i){var x=pad+(w-2*pad)*i/(vals.length-1); var y=pad+(h-2*pad)*(1-(v-min)/rng); return x.toFixed(1)+','+y.toFixed(1);});
    var last=pts[pts.length-1].split(',');
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      '<defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#AEEBFF"/><stop offset="1" stop-color="#BFA6FF"/></linearGradient></defs>'+
      '<polyline fill="none" stroke="url(#spg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="'+pts.join(' ')+'"/>'+
      '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="4.5" fill="#BFA6FF"/></svg>';
  }

  function bodyWeight(){
    var ws=body.weights.slice().sort(function(a,b){return (a.date||'').localeCompare(b.date||'')});
    var latest=ws[ws.length-1], prev=ws[ws.length-2];
    var hero = latest? '<div class="big-stat"><div class="bv">'+(+latest.kg)+' <small>kg</small></div><div class="bk">Latest · '+fmtDate(latest.date)+'</div>'+
        (prev?(function(){var dd=(+latest.kg)-(+prev.kg); var cls=dd<0?'down':dd>0?'up':'flat'; var ar=dd<0?'↓':dd>0?'↑':'→'; return '<div class="delta '+cls+'">'+ar+' '+Math.abs(dd).toFixed(1)+' kg since last</div>';})():'')+'</div>'
      : '<div class="empty" style="padding:22px"><div class="em">⚖️</div><p>No weigh-ins yet. Add your first below 💜</p></div>';
    var chart = ws.length>=2? '<div class="card">'+sparkline(ws.slice(-14).map(function(x){return +x.kg}))+
        '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:2px"><span>'+fmtDate(ws[Math.max(0,ws.length-14)].date)+'</span><span>now</span></div></div>' : '';
    var addForm='<div class="section-label">➕ Log a weigh-in</div><div class="card"><form id="wform"><div class="mini-form">'+
      '<div class="field"><label>Weight (kg)</label><input name="kg" inputmode="decimal" placeholder="68.4" required></div>'+
      '<div class="field"><label>Date</label><input name="date" type="date" value="'+today()+'"></div>'+
      '<button class="btn" type="submit">Add</button></div>'+

    var rows=body.weights.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'')}).slice(0,20).map(function(x){
      return '<div class="log-row"><span class="ld">'+fmtDate(x.date)+'</span><span class="lv">'+(+x.kg)+' kg</span><span class="ln">'+esc(x.note||'')+'</span><button class="del" data-delw="'+x.id+'">🗑</button></div>';}).join('');

  function bodyCycle(){
    var ps=body.periods.slice().sort(function(a,b){return (a.start||'').localeCompare(b.start||'')});
    var np=nextPeriodInfo();
    var hero = np? '<div class="cycle-hero"><div class="ch-day">Day '+np.cycleDay+'</div><div class="ch-k">of your cycle · last period '+fmtDate(np.last)+'</div></div>'
      : '<div class="empty" style="padding:22px"><div class="em">🌸</div><p>Log when your period starts and I’ll predict the next one 💜</p></div>';
    var pred = np? '<div class="card"><div class="pred"><div class="stat"><div class="k">Next period</div><div class="v" style="font-size:16px">'+fmtDate(np.date)+'</div></div>'+
      '<div class="stat"><div class="k">In</div><div class="v">'+(np.days>=0?np.days+' <small>days</small>':'now')+'</div></div>'+
      '<div class="stat"><div class="k">Avg cycle</div><div class="v">'+np.avg+' <small>d</small></div></div></div></div>' : '';
    var addForm='<div class="section-label">➕ Log a period</div><div class="card"><form id="pform"><div class="mini-form">'+
      '<div class="field"><label>Started</label><input name="start" type="date" value="'+today()+'" required></div>'+
      '<div class="field"><label>Ended</label><input name="end" type="date"></div>'+
      '<button class="btn" type="submit">Add</button></div></form>'+
      '<button class="btn ghost" id="period-today" style="margin-top:10px">🌸 It started today</button></div>';
    var rows=ps.slice().reverse().slice(0,16).map(function(x){var dur=x.end?(daysBetween(x.start,x.end)+1)+' days':'ongoing';
      return '<div class="log-row"><span class="ld">'+fmtDate(x.start)+'</span><span class="lv">'+dur+'</span><span class="ln"></span><button class="del" data-delp="'+x.id+'">🗑</button></div>';}).join('');
    return hero+pred+addForm+(ps.length?'<div class="section-label">History</div><div class="card">'+rows+'</div>':'');
  }

  function bodyMood(){

  function moneyShort(n){return settings.currency+(Math.round(Number(n)||0)).toLocaleString('en-ZA');}
  function monthKey(iso){return (iso||'').slice(0,7);}
  function monthLabel(key){var p=key.split('-'); var d=new Date(+p[0],+p[1]-1,1); return d.toLocaleDateString('en-ZA',{month:'long',year:'numeric'});}
  function shiftMonth(key,delta){var p=key.split('-'); var d=new Date(+p[0],+p[1]-1+delta,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  function monthExpenses(key){return tx.filter(function(t){return monthKey(t.date)===key && t.type!=='income'});}
  var spendMonth=(function(){var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');})();

        '<button class="btn ghost sm" id="imp-btn">⬆️ Import CSV</button></div><input type="file" id="csv-file" accept=".csv,text/csv" class="hidden"></div>';

    else grad+='var(--border) 0 100%';

      '<div class="donut-wrap"><div class="donut" style="background:'+grad+'"><div class="dc"><div class="dv">'+moneyShort(totalSpent)+'</div><div class="dk">spent</div></div></div>'+

    var actions='<div class="stat-row" style="margin-top:14px"><button class="btn sm" data-nav-go="/money/new" style="flex:1">＋ Add</button>'+
      '<button class="btn ghost sm" id="imp-btn" style="flex:1">⬆️ Import</button>'+
      '<button class="btn ghost sm" data-nav-go="/money/budgets" style="flex:1">🎯 Budgets</button></div><input type="file" id="csv-file" accept=".csv,text/csv" class="hidden">';

    var over=cats.filter(function(c){return budgets[c]&&totals[c]>budgets[c];});
    var flags=over.length? '<div class="card" style="margin-top:14px;border-color:var(--danger)"><div style="font-weight:700;color:var(--danger);margin-bottom:4px">⚠️ Over budget this month</div>'+
      over.map(function(c){return '<div style="font-size:13px;color:var(--ink-soft)">'+SPEND_CATS[c].icon+' '+SPEND_CATS[c].label+' — '+money(totals[c])+' of '+money(budgets[c])+' <b style="color:var(--danger)">('+money(totals[c]-budgets[c])+' over)</b></div>';}).join('')+'</div>' : '';

        '<div class="meta"><div class="td">'+esc(t.desc||c.label)+'</div><div class="tc">'+c.label+' · '+fmtDate(t.date)+'</div></div>'+
        '<div class="ta '+(inc?'inc':'')+'">'+(inc?'+':'−')+money(t.amount).replace(settings.currency+' ',settings.currency)+'</div></div>';}).join('')+'</div>';

  /* ---------- CSV import ---------- */
  function parseCSV(text){
    var rows=[], row=[], cur='', inQ=false; text=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    for(var i=0;i<text.length;i++){var ch=text[i];
      if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
      else { if(ch==='"') inQ=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else cur+=ch; } }
    if(cur.length||row.length){row.push(cur);rows.push(row);}
    return rows.filter(function(r){return r.some(function(c){return (c||'').trim()!==''})});
  }
  function parseAmt(s){ if(s==null)return null; s=String(s).replace(/[^0-9.\-]/g,''); if(s===''||s==='-'||s==='.')return null; var n=parseFloat(s); return isNaN(n)?null:n; }
  function parseDate(s){ s=(s||'').trim(); if(!s) return today();
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){var dd=+m[1],mm=+m[2],yy=+m[3]; if(mm>12&&dd<=12){var tmp=dd;dd=mm;mm=tmp;} if(yy<100)yy+=2000; return yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0');}
    var tt=Date.parse(s); if(!isNaN(tt)){var d=new Date(tt); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
    return today();
  }
  function importCSV(text){
    var rows=parseCSV(text); if(!rows.length) return {added:0,month:null};
    var header=rows[0].map(function(h){return (h||'').trim().toLowerCase()});
    var di=-1,ei=-1,ai=-1,debi=-1,credi=-1;
    header.forEach(function(h,idx){
      if(di<0&&/date/.test(h))di=idx;
      if(ei<0&&/(desc|narrat|detail|reference|memo|transaction|payee|merchant|name)/.test(h))ei=idx;
      if(debi<0&&/debit/.test(h))debi=idx;
      if(credi<0&&/credit/.test(h))credi=idx;
      if(ai<0&&/(amount|value|total)/.test(h))ai=idx;
    });
    var hasHeader=(di>-1||ai>-1||ei>-1||debi>-1||credi>-1);
    var start=hasHeader?1:0; if(!hasHeader){di=0;ei=1;ai=2;}
    var added=0, lastMonth=null;
    for(var i=start;i<rows.length;i++){var r=rows[i]; if(!r)continue;
      var desc=((ei>-1&&r[ei])||'').trim(); var amt=0,type='expense';
      if(debi>-1||credi>-1){var deb=parseAmt(debi>-1?r[debi]:''),cre=parseAmt(credi>-1?r[credi]:'');
        if(deb){amt=Math.abs(deb);type='expense';} else if(cre){amt=Math.abs(cre);type='income';} }
      else{var v=parseAmt(ai>-1?r[ai]:''); if(v==null)continue; if(v<0){amt=Math.abs(v);type='expense';}else{amt=v;type='income';}}
      if(!amt) continue;
      var date=parseDate(di>-1?r[di]:''); lastMonth=monthKey(date);
      tx.push({id:uid(),date:date,desc:desc||'Transaction',amount:amt,type:type,category:categorize(desc)}); added++;
    }
    if(added) save(K.tx,tx);
    return {added:added,month:lastMonth};
  }

  function render(){
    var path=current();
    closeSheet();
    var html, seg=path.split('/');
    if(path==='/') html=screenHome();
    else if(path==='/vault') html=screenVault();
    else if(path==='/vault/new') html=screenVaultForm(null);
    else if(seg[1]==='vault'&&seg[2]==='edit'&&seg[3]) html=screenVaultForm(seg[3]);
    else if(path==='/recipes') html=screenRecipes();
    else if(path==='/recipes/new') html=screenRecipeForm(null);
    else if(seg[1]==='recipes'&&seg[2]==='edit'&&seg[3]) html=screenRecipeForm(seg[3]);
    else if(seg[1]==='recipes'&&seg[2]==='view'&&seg[3]) html=screenRecipeView(seg[3]);
    else if(path==='/body') html=screenBody();
    else if(path==='/money') html=screenSpending();
    else if(path==='/money/new') html=screenSpendForm(null);
    else if(seg[1]==='money'&&seg[2]==='edit'&&seg[3]) html=screenSpendForm(seg[3]);
    else if(path==='/money/budgets') html=screenBudgets();
    else if(path==='/more') html=screenMore();
    else html=screenNotFound();

    app.innerHTML='<div class="screen">'+html+'</div>';
    window.scrollTo(0,0);
    setNav(path);
    wire(path);
  }

    document.querySelectorAll('[data-btab]').forEach(function(el){el.onclick=function(){bodyTab=el.getAttribute('data-btab'); render();}});
    var wform=$('#wform'); if(wform) wform.onsubmit=function(ev){ev.preventDefault(); var fd=new FormData(wform); var kg=parseFloat(fd.get('kg'));
      if(!kg){toast('Enter a weight ✨');return;} body.weights.push({id:uid(),date:fd.get('date')||today(),kg:kg,note:(fd.get('note')||'').trim()}); save(K.body,body); toast('Weight logged 💜'); render();};
    var pform=$('#pform'); if(pform) pform.onsubmit=function(ev){ev.preventDefault(); var fd=new FormData(pform); var st=fd.get('start');
      if(!st){toast('Pick a start date');return;} body.periods.push({id:uid(),start:st,end:fd.get('end')||''}); save(K.body,body); toast('Logged 🌸'); render();};
    var pt=$('#period-today'); if(pt) pt.onclick=function(){ body.periods.push({id:uid(),start:today(),end:''}); save(K.body,body); toast('Logged 🌸'); render();};
    document.querySelectorAll('[data-mood]').forEach(function(el){el.onclick=function(){var i=parseInt(el.getAttribute('data-mood'),10);
      var noteEl=$('#mood-note'); var note=noteEl?noteEl.value.trim():''; body.moods.push({id:uid(),date:today(),mood:i,note:note,ts:Date.now()}); save(K.body,body); toast('Mood logged '+MOODS[i].e); render();};});
    document.querySelectorAll('[data-delw]').forEach(function(el){el.onclick=function(){body.weights=body.weights.filter(function(x){return x.id!==el.getAttribute('data-delw')}); save(K.body,body); render();}});
    document.querySelectorAll('[data-delp]').forEach(function(el){el.onclick=function(){body.periods=body.periods.filter(function(x){return x.id!==el.getAttribute('data-delp')}); save(K.body,body); render();}});
    document.querySelectorAll('[data-delm]').forEach(function(el){el.onclick=function(){body.moods=body.moods.filter(function(x){return x.id!==el.getAttribute('data-delm')}); save(K.body,body); render();}});

    // Spending
    document.querySelectorAll('[data-mshift]').forEach(function(el){el.onclick=function(){spendMonth=shiftMonth(spendMonth,parseInt(el.getAttribute('data-mshift'),10)); render();}});
    var impBtn=$('#imp-btn'), csvFile=$('#csv-file');
    if(impBtn&&csvFile){ impBtn.onclick=function(){csvFile.click()}; csvFile.onchange=function(){var f=csvFile.files[0]; if(!f)return;
      var rd=new FileReader(); rd.onload=function(){ var res=importCSV(rd.result);
        if(res.added){ if(res.month) spendMonth=res.month; toast('Imported '+res.added+' transaction'+(res.added>1?'s':'')+' ✨'); render(); }
        else toast('No transactions found in that file 😕'); };
      rd.readAsText(f); }; }
    document.querySelectorAll('[data-txopen]').forEach(function(el){el.onclick=function(){go('/money/edit/'+el.getAttribute('data-txopen'))}});

    var txform=$('#txform'); if(txform){
      var descEl=$('#tx-desc'), catEl=$('#tx-cat'), catTouched=false;
      if(catEl) catEl.onchange=function(){catTouched=true;};
      if(descEl) descEl.onblur=function(){ if(!catTouched && descEl.value.trim()){ catEl.value=categorize(descEl.value); } };
      txform.onsubmit=function(ev){ev.preventDefault(); var seg=path.split('/'); var id=(seg[1]==='money'&&seg[2]==='edit')?seg[3]:null;
        var fd=new FormData(txform); var amt=parseFloat(fd.get('amount'));
        if(!amt){toast('Enter an amount ✨');return;}
        var obj={type:fd.get('type')||'expense',amount:Math.abs(amt),desc:(fd.get('desc')||'').trim(),category:fd.get('category'),date:fd.get('date')||today()};
        if(id){var i=tx.findIndex(function(x){return x.id===id}); if(i>-1) tx[i]=Object.assign({},tx[i],obj);}
        else{obj.id=uid(); tx.unshift(obj);}
        save(K.tx,tx); spendMonth=monthKey(obj.date); toast(id?'Saved 💜':'Added ✨'); go('/money');
      };
      var txdel=$('[data-txdel]',txform); if(txdel) txdel.onclick=function(){ if(confirm('Delete this transaction?')){var did=txdel.getAttribute('data-txdel');
        tx=tx.filter(function(x){return x.id!==did}); save(K.tx,tx); toast('Deleted'); go('/money');} };
    }
    document.querySelectorAll('[data-budget]').forEach(function(el){el.onchange=function(){var c=el.getAttribute('data-budget'); var v=parseFloat(el.value)||0;
      if(v>0) budgets[c]=v; else delete budgets[c]; save(K.budgets,budgets); el.blur(); setTimeout(render,0);};});

    // More screen
    var sn=$('#s-name'); if(sn) sn.onchange=function(){settings.name=sn.value.trim()||'you'; save(K.settings,settings); toast('Updated 💜')};
    var ex=$('#s-export'); if(ex) ex.onclick=exportData;
    var im=$('#s-import'); var file=$('#s-file');
    if(im&&file){im.onclick=function(){file.click()}; file.onchange=function(){importData(file.files[0])};}
  }

  function exportData(){
    var payload={app:'Life Index',version:1,exportedAt:new Date().toISOString(),settings:settings,vault:vault,recipes:recipes,body:body,tx:tx,budgets:budgets};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='life-index-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000); toast('Backup downloaded ⬇️');
  }
  function importData(f){ if(!f)return; var r=new FileReader();
    r.onload=function(){try{var data=JSON.parse(r.result);
      if(!data||!Array.isArray(data.vault)) throw 0;
      if(!confirm('Restore this backup? It will replace what’s here now.')) return;
      vault=data.vault; if(Array.isArray(data.recipes)) recipes=data.recipes;
      if(data.body){ body=data.body; if(!body.weights)body.weights=[]; if(!body.periods)body.periods=[]; if(!body.moods)body.moods=[]; }
      if(Array.isArray(data.tx)) tx=data.tx; if(data.budgets&&typeof data.budgets==='object') budgets=data.budgets;
      if(data.settings) settings=Object.assign(settings,data.settings);
      save(K.vault,vault); save(K.recipes,recipes); save(K.body,body); save(K.tx,tx); save(K.budgets,budgets); save(K.settings,settings); toast('Restored 💜'); go('/');
    }catch(e){toast('That file didn’t look right 😕')}};
    r.readAsText(f);
  }

  /* ---------- quick-add sheet ---------- */
  function openSheet(){
    var s=$('#sheet');
    s.innerHTML='<div class="grab"></div><h3>Quick Add ✨</h3><p class="sd">What would you like to capture?</p>'+
      '<div class="qa-grid" style="margin-bottom:6px">'+
        '<div class="qa" data-q="/vault/new"><span class="e b-lav">🗝️</span>Vault entry</div>'+
        '<div class="qa" data-q="/recipes/new"><span class="e b-pink">🍳</span>Recipe</div>'+
        '<div class="qa" data-q="/body"><span class="e b-mint">🌸</span>My Body</div>'+
        '<div class="qa" data-q="/money/new"><span class="e b-yellow">💸</span>Expense</div>'+
      '</div>';
    $('#backdrop').classList.add('open'); s.classList.add('open');
    s.querySelectorAll('[data-q]').forEach(function(el){el.onclick=function(){closeSheet(); go(el.getAttribute('data-q'))}});
    s.querySelectorAll('[data-qsoon]').forEach(function(el){el.onclick=function(){closeSheet(); toast('✨ '+el.getAttribute('data-qsoon')+' is coming soon!')}});
  }
  function closeSheet(){$('#backdrop').classList.remove('open'); $('#sheet').classList.remove('open');}
  $('#fab').onclick=openSheet;
  $('#backdrop').onclick=closeSheet;
  document.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-nav'))}});

  /* ---------- PWA (harmless where unsupported) ---------- */
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('./sw.js').catch(function(){}); }catch(e){} }

  render();
})();
</script>

</body>
</html>
